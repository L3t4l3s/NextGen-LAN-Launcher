name: Release

# Builds installers for Windows, macOS and Linux when a tag `v*` is pushed.
# The official Resilio Sync binary is downloaded from the URLs in
# resilio.lock.json and placed in src-tauri/resources/resilio so it ships with
# the installer (the repository itself never contains it).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            args: ""
          - os: windows-latest
            platform: windows
            args: ""
          - os: macos-latest
            platform: osx
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Fetch Resilio Sync binary
        shell: bash
        run: node tools/fetch-resilio.mjs ${{ matrix.platform }} src-tauri/resources/resilio
      # Build and upload are two steps on purpose: the AppImage has to be
      # opened up again in between, and tauri-action publishes from inside the
      # same step it builds in, which would be too late.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      # Same reason as in ci.yml: linuxdeploy packs all four Wayland libraries,
      # libwayland-client included although the AppImage exclude list names it,
      # while Mesa comes from the machine. See
      # tools/appimage-unbundle-wayland.mjs.
      - name: Take the Wayland libraries back out of the AppImage
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: node tools/appimage-unbundle-wayland.mjs target/release/bundle/appimage
      # Flat, so the release assets are not buried under bundle/nsis/ and so
      # the publish step below can name them with one glob.
      - name: Collect installers
        shell: bash
        run: |
          set -eu
          mkdir -p installers
          for root in target/release/bundle target/universal-apple-darwin/release/bundle; do
            [ -d "$root" ] || continue
            find "$root" -type f \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} installers/ \;
          done
          ls -l installers
      # Only for a tag. A manual run builds and leaves the installers as a
      # workflow artifact instead of inventing a release from a branch name.
      - name: Publish to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "NextGen LAN Launcher ${{ github.ref_name }}"
          body: "Siehe CHANGELOG.md. Windows: Setup.exe doppelklicken. macOS: DMG öffnen. Linux: AppImage ausführbar machen."
          draft: true
          prerelease: true
          files: installers/*
      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: warn
          path: installers/*
