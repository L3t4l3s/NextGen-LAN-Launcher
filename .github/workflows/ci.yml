name: CI

# Every push runs the cheap checks (core tests on Linux, frontend). The full
# three-OS matrix and the installer builds are expensive (about 3x3 runners), so
# they run only for pull requests, pushes to `main` (the future release branch;
# the current development branch deliberately gets the light set), manual runs,
# or when the commit message contains "[full-ci]". Tags are handled by
# release.yml. Keep the `FULL` expressions below in sync; GitHub offers no
# workflow-level variable for them.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch cancels the still-running builds of the old
  # one, except on main where every commit must keep its checks and artifacts.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # FULL: all three platforms; otherwise Linux only.
        os: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')) && '["ubuntu-22.04", "windows-latest", "macos-latest"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (core)
        run: cargo clippy -p lanlauncher-core --all-targets -- -D warnings
      - name: Test (core)
        run: cargo test -p lanlauncher-core

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  app:
    name: Build app (${{ matrix.os }})
    needs: [core, frontend]
    # FULL: same condition as the core matrix above.
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            args: ""
          - os: windows-latest
            platform: windows
            args: ""
          - os: macos-latest
            platform: osx
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      # Same pinned Resilio build as release.yml, so a CI installer behaves
      # like a release on a test PC. The download is immutable per pinned hash
      # and the folder layout depends only on the fetch script, so the folder
      # is cached under both and the CDN is contacted once per pin and platform.
      - name: Resilio lock hash
        id: lock
        shell: bash
        run: echo "sha=$(node -p "require('./resilio.lock.json').artifacts['${{ matrix.platform }}'].sha256")" >> "$GITHUB_OUTPUT"
      - name: Cache Resilio Sync binary
        id: resilio-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/resources/resilio
          key: resilio-${{ matrix.platform }}-${{ steps.lock.outputs.sha }}-${{ hashFiles('tools/fetch-resilio.mjs') }}
      - name: Fetch Resilio Sync binary
        if: steps.resilio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: node tools/fetch-resilio.mjs ${{ matrix.platform }} src-tauri/resources/resilio
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      # linuxdeploy packs all four Wayland libraries, libwayland-client
      # included although the AppImage exclude list names it, while libEGL and
      # the rest of Mesa correctly come from the machine. Mesa cannot load
      # against that mix. Tauri's bundler is a prebuilt binary with no hook
      # between linuxdeploy and the finished image, so the image is opened
      # again here. The script expects to find all four and fails if it does
      # not: that means the bundler changed, not that the step is unnecessary.
      # See tools/appimage-unbundle-wayland.mjs.
      - name: Take the Wayland libraries back out of the AppImage
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: node tools/appimage-unbundle-wayland.mjs target/release/bundle/appimage
      # upload-artifact keeps the folders the matched files sit in, which
      # buries Setup.exe under release/bundle/nsis/ in the downloaded zip.
      # Copying the installers flat first puts them at the top of it.
      - name: Collect installers
        shell: bash
        run: |
          set -eu
          mkdir -p installers
          for root in target/release/bundle target/universal-apple-darwin/release/bundle; do
            [ -d "$root" ] || continue
            find "$root" -type f \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} installers/ \;
          done
          ls -l installers
      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: warn
          path: installers/*
