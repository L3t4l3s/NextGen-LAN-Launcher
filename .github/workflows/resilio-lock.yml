name: Resilio lock

# Computes the SHA-256 hashes and version numbers of the official Resilio Sync
# downloads so they can be pinned in resilio.lock.json. Run it manually, then
# copy the artifact `resilio.lock.proposed.json` over resilio.lock.json and
# commit. The release workflow refuses to build without pinned hashes. Pass a
# build number as `version` to pin an older release instead of the current stable
# one (e.g. 2.8.1.1390, the last build that runs without a Resilio account).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Resilio build to pin (e.g. 2.8.1.1390). Empty = current stable release."
        required: false
        default: ""
        type: string

jobs:
  hashes:
    name: Hash (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # arm64 is not part of the release matrix yet; a missing download must not fail the run.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-latest
            optional: true
          - platform: windows
            os: windows-latest
          - platform: osx
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download and hash
        id: fetch
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # tee keeps the per-URL status lines visible even when every candidate fails
          node tools/fetch-resilio.mjs "${{ matrix.platform }}" out --allow-unpinned ${VERSION:+"--version=$VERSION"} | tee fetch.log
          grep '^::lock:: ' fetch.log | sed 's/^::lock:: //' > lock-entry.json
      - name: Read version (Linux)
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" != "linux-x64" ]; then
            # Foreign architecture: run the binary through qemu-user (binfmt is registered by the package).
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static || echo "::warning::qemu-user-static not installed; falling back to strings"
          fi
          ./out/rslsync --help > help.txt 2>&1 || {
            rc=$?; echo "::warning::rslsync --help failed (exit $rc); output:"; cat help.txt || true
          }
          ver=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' help.txt | head -1 || true)
          if [ -z "$ver" ]; then
            # Fall back to embedded strings. IPv4 addresses and netmasks (127.0.0.1,
            # 255.255.255.255) also look like dotted versions but never carry a
            # four-digit last component, which Resilio build numbers always do.
            ver=$(strings out/rslsync | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{4,5}$' | head -1 || true)
          fi
          echo "detected version: ${ver:-<none>}"
          echo "version=$ver" >> lock-version.txt
      - name: Read version (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $f = Get-ChildItem out\*.exe | Select-Object -First 1
          $v = (Get-Item $f.FullName).VersionInfo.ProductVersion
          "version=$v" | Out-File -Encoding utf8 -Append lock-version.txt
      - name: Read version (macOS)
        if: matrix.platform == 'osx'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "out/Resilio Sync.app/Contents/Info.plist" || true)
          echo "version=$ver" >> lock-version.txt
      - name: Assemble entry
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const e = JSON.parse(fs.readFileSync("lock-entry.json", "utf8"));
            const v = (fs.existsSync("lock-version.txt") ? fs.readFileSync("lock-version.txt","utf8") : "").match(/version=(.*)/);
            e.version = v ? v[1].trim() : null;
            e.retrieved_at = new Date().toISOString();
            fs.writeFileSync(`entry-${e.platform}.json`, JSON.stringify(e, null, 2));
            console.log(JSON.stringify(e, null, 2));
          '
      - uses: actions/upload-artifact@v6
        with:
          name: entry-${{ matrix.platform }}
          path: entry-*.json

  assemble:
    name: Proposed resilio.lock.json
    needs: hashes
    # Merge whatever platforms succeeded even if one hash job failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: entry-*
          merge-multiple: true
          path: entries
      - name: Merge
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("resilio.lock.json", "utf8"));
            for (const f of fs.readdirSync("entries")) {
              const e = JSON.parse(fs.readFileSync(`entries/${f}`, "utf8"));
              const cur = lock.artifacts[e.platform] ?? {};
              // When the binary probe yields nothing (foreign architecture), the build segment of the URL is authoritative.
              const version = e.version || e.url.match(/\/([0-9]+(?:\.[0-9]+){1,3})\//)?.[1] || null;
              lock.artifacts[e.platform] = { ...cur, url: e.url, version, sha256: e.sha256, bytes: e.bytes, retrieved_at: e.retrieved_at };
            }
            // Windows reports a four-part ProductVersion; compare the release part only.
            const short = (v) => String(v).split(".").slice(0, 3).join(".");
            const versions = [...new Set(Object.values(lock.artifacts).map(a => a.version).filter(Boolean).map(short))];
            lock.version = versions.length === 1 ? versions[0] : versions.join(" / ");
            fs.writeFileSync("resilio.lock.proposed.json", JSON.stringify(lock, null, 2) + "\n");
            console.log(fs.readFileSync("resilio.lock.proposed.json", "utf8"));
          '
      - uses: actions/upload-artifact@v6
        with:
          name: resilio.lock.proposed
          path: resilio.lock.proposed.json
