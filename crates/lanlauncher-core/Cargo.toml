[package]
name = "lanlauncher-core"
description = "Core library of the NextGen LAN Launcher: ETI catalog, Resilio transport, install state machine, launching, diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

log = "0.4"
tokio.workspace = true
reqwest.workspace = true
toml = "1.1"
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
encoding_rs = "0.8"
url = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }
unrar = "0.5"
tar = "0.4"
sha2 = "0.11"
hex = "0.4"
sysinfo = "0.38"
walkdir = "2.5"
directories = "6.0"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["full", "test-util"] }
