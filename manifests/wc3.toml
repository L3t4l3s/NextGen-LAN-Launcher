schema = 1
id = "wc3"
title = "Warcraft III: The Frozen Throne"
revisions = ["20201021"]
source = "macETI-LAN v0.6.1 docs (MIT) – window/OpenGL mode tested on Apple M2 Pro"

[launch]
exe = "Warcraft III.exe"
# ETI's Windows script uses -nativefullscr -frozenthrone (without it the game starts Reign of Chaos); under CrossOver -window -opengl was the stable choice.
args = ["-nativefullscr", "-frozenthrone"]
required_files = ["Warcraft III.exe"]

[platform.macos]
runner = "crossover"
args = ["-window", "-opengl", "-frozenthrone"]

[platform.linux]
args = ["-window", "-opengl", "-frozenthrone"]

[setup]
notes.de = "game_setup.cmd schreibt die CD-Keys (wc3_keys.exe), legt das Profil unter Dokumente\\Warcraft III an und setzt Registry-Werte; auf Mac/Linux läuft es im Prefix des Spiels. Der LAN-Browser braucht ggf. den Bonjour-Dienst in der Bottle."
notes.en = "game_setup.cmd writes the CD keys (wc3_keys.exe), creates the profile in Documents\\Warcraft III and sets registry values; on Mac/Linux it runs in the game's prefix. The LAN browser may need the Bonjour service inside the bottle."

# The name for LAN games, which Warcraft III otherwise asks for.
[[settings]]
registry = 'HKCU\Software\Blizzard Entertainment\Warcraft III\String'
key = "userlocal"
value = "%player%"
