schema = 1
id = "cod2"
title = "Call of Duty 2"
revisions = ["20160922"]
source = "macETI-LAN v0.6.1 docs (MIT); NextGen LAN Launcher: start script and player profile checked with Proton 11 (2026-10)"
script_start_checked = ["linux"]

[launch]
# No entry point of its own: the start runs the package's game_start.cmd,
# which starts the multiplayer binary (CoD2MP_s.exe).
exe = ""
args = []

[platform.macos]
runner = "crossover"

[setup]
notes.de = "Unter Proton geprüft: Das Startskript startet die Mehrspieler-Datei, das Paket ist deutsch. Das Spielerprofil (players/LAN) legt der Launcher mit dem eingetragenen Namen an. Ohne Grafikkarte bleibt das Intro-Video hängen; auf CrossOver ungeprüft."
notes.en = "Checked with Proton: the start script starts the multiplayer executable, the package is German. The launcher creates the player profile (players/LAN) with the player's name. Without a graphics card the intro movie hangs; untested on CrossOver."

# The player profile Call of Duty 2 otherwise asks for at the first start
# (players/active.txt names it, its config_mp.cfg holds the name). A fixed
# profile name: a player's name may hold what a folder name cannot.
[[settings]]
file = "main/players/active.txt"
value = "LAN"

[[settings]]
file = "main/players/LAN/config_mp.cfg"
line = "seta name"
value = "%player%"
