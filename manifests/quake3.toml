schema = 1
id = "quake3"
title = "Quake 3 Arena"
revisions = ["20160922"]
source = "ETI game_start.cmd (Unlicense); macETI-LAN docs recommend the native ioquake3 engine on macOS; NextGen LAN Launcher: started and player name checked with Proton 11 (2026-10)"

[tested_with]
linux = ["Proton 11.0"]

[launch]
exe = "quake3.exe"
args = []
required_files = ["quake3.exe", "baseq3/pak0.pk3"]

[setup]

# The package ships the q3config.cfg of whoever packed it, name included.
[[settings]]
file = "baseq3/q3config.cfg"
line = "seta name"
value = "%player%"

[setup.platform_notes.macos]
de = "Alternativ läuft ioquake3 nativ: Engine installieren, über „Startdatei wählen“ die ioquake3-App nehmen; die Spieldaten (baseq3) liegen in local/."
en = "Alternatively ioquake3 runs natively: install the engine, pick the ioquake3 app through 'Choose executable'; the game data (baseq3) is in local/."
