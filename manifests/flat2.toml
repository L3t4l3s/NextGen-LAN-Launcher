schema = 1
id = "flat2"
title = "FlatOut 2"
revisions = ["20160922"]
source = "macETI-LAN v0.6.1 docs (MIT) – v1.2 profile menu verified on Apple M2 Pro, CrossOver 26.3"

[launch]
# No verified entry point for this package: the executable and its arguments
# come from the Windows start script, this file only carries what was learned
# about running it.
exe = ""
args = []
# Wine's own d3dx9_30 cannot build the game's effects: "Failed to create
# effect: data/shader/pro_static2x.sha" and the game ends. Microsoft's DLL
# from the DirectX runtime does (checked with Proton 11: intro and German
# menu). The launcher offers to install it before the first start.
winetricks = ["d3dx9_30"]

[platform.macos]
runner = "crossover"

[setup]
notes.de = "Beim ersten Start auf einem Rechner (und nach einem Grafiktreiber-Wechsel) zeigt das Spiel sein Einstellungsfenster: dort Anzeigemodus mit 32 Bit und passendem Seitenverhältnis wählen, voreingestellt ist 640 × 400 × 16. Später erreichbar mit dem Argument '-setup'. Den Spielernamen fragt das Spiel beim Anlegen eines Profils ab. Ohne d3dx9_30 (unter Linux bietet der Launcher es vor dem ersten Start an, bei CrossOver die DirectX-Runtime Juni 2010 über „Software installieren“) endet das Spiel mit „Failed to create effect“. Bleibt das Spiel in einem kleinen Fenster, ist meist ein erzwungener virtueller Wine-Desktop schuld."
notes.en = "On its first start on a machine (and after a graphics driver change) the game shows its settings window: pick a display mode with 32-bit colour and a matching aspect ratio, the default is 640 × 400 × 16. Later it opens with the argument '-setup'. The game asks for the player name when a profile is created. Without d3dx9_30 (on Linux the launcher offers it before the first start; with CrossOver, the June 2010 DirectX runtime through \"Install Software\") the game ends with \"Failed to create effect\". A game stuck in a small window usually means a forced Wine virtual desktop."
