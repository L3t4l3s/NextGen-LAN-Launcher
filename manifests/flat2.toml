schema = 1
id = "flat2"
title = "FlatOut 2"
revisions = ["20160922"]
source = "macETI-LAN v0.6.1 docs (MIT) – v1.2 profile menu verified on Apple M2 Pro, CrossOver 26.3; NextGen LAN Launcher: start script checked with Proton 11 (2026-10)"
script_start_checked = ["linux"]

[launch]
# The package's start script starts FlatOut2.exe; this file only carries
# what was learned about running it.
exe = ""
args = []
# Wine's own d3dx9_30 cannot build the game's effects: "Failed to create
# effect: data/shader/pro_static2x.sha" and the game ends. Microsoft's DLL
# from the DirectX runtime does (checked with Proton 11: intro and German
# menu). The launcher offers to install it before the first start.
winetricks = ["d3dx9_30"]

[platform.macos]
runner = "crossover"

[setup]
# The game asks for the player name when a profile is made; DefaultPlayerName in
# Savegame/options.cfg does not fill it in (checked). Its settings window comes up
# on the first start per machine; the default 640 x 400 x 16 runs (checked).

[setup.platform_notes.macos]
de = "Vorher die DirectX-Runtime (Juni 2010) über „Software installieren“ in die Flasche installieren, sonst endet das Spiel mit „Failed to create effect“."
en = "Install the DirectX runtime (June 2010) into the bottle through 'Install Software' first, otherwise the game ends with 'Failed to create effect'."
