schema = 1
id = "woc"
title = "World in Conflict"
revisions = ["20161205"]
source = "NextGen LAN Launcher: start script, German menu (Soviet Assault 1.0.1.1) and the LAN name checked with Proton 11 (2026-10); multiplayer unchecked"
script_start_checked = ["linux"]

[tested_with]
linux = ["Proton 11.0"]

[launch]
# No entry point of its own: the package's game_start.cmd starts wic.exe
# from local/.
exe = ""
args = []

# The game makes the profile at its first start with Spieler as both names.
# Without a byte order mark it writes its defaults over the file; with one,
# these two lines are enough and it adds the rest (checked with Proton 11).
[[settings]]
folder = "documents"
file = "World in Conflict/Player Profile.txt"
line = "myLANPlayerName"
quote = false
value = "%player%"
bom = true

[[settings]]
folder = "documents"
file = "World in Conflict/Player Profile.txt"
line = "myPlayerName"
quote = false
value = "%player%"
bom = true
