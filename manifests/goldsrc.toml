schema = 1
id = "goldsrc"
title = "Counter-Strike 1.6 / GoldSrc"
revisions = ["20240623"]
source = "macETI-LAN v0.6.1 (MIT) – CS 1.6 menu verified on Apple M2 Pro, CrossOver 26.3; NextGen LAN Launcher: start script menu checked with Proton 11 (2026-10)"
script_start_checked = ["linux"]

[tested_with]
linux = ["Proton 11.0"]
macos = ["CrossOver 26.3"]

[launch]
# Started through the package's start script, as on Windows: its menu
# offers CS 1.6, CS 1.5, Half-Life and Half-Life pre-Steam. The direct
# start below was verified with CrossOver and stays as a way round it.
exe = ""
args = []
required_files = [
  "hl-cs16/SmartSteamLoader.exe",
  "hl-cs16/hl.exe",
  "hl-cs16/hw.dll",
  "hl-cs16/cstrike/liblist.gam",
  "hl-cs16/cstrike/dlls/mp.dll",
  "hl-cs16/cstrike/cl_dlls/client.dll",
]

[[launch.alternatives]]
name = "Counter-Strike 1.6 (direkt)"
exe = "hl-cs16/SmartSteamLoader.exe"
args = ["-game", "cstrike"]
workdir = "hl-cs16"

[[launch.alternatives]]
name = "Half-Life"
exe = "hl-cs16/SmartSteamLoader.exe"
args = ["-game", "valve"]
workdir = "hl-cs16"

[platform.macos]
runner = "crossover"

[setup]
# The root SmartSteamEmu.ini is copied next to the CS 1.6 loader, mirroring the Windows script.
copy = [{ from = "SmartSteamEmu.ini", to = "hl-cs16/SmartSteamEmu.ini" }]
# '-game cstrike' has to be two arguments.
notes.de = "Ohne gewählte Startdatei fragt das Konsolenfenster beim Start, welches Spiel starten soll: CS 1.6, CS 1.5 oder Half-Life. CS 1.6 und Half-Life lassen sich über „Startdatei wählen“ auch direkt starten."
notes.en = "Without a chosen executable the console window asks at start which game to start: CS 1.6, CS 1.5 or Half-Life. CS 1.6 and Half-Life also start directly through 'Choose executable'."
