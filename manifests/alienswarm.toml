schema = 1
id = "alienswarm"
title = "Alien Swarm: Reactive Drop"
revisions = ["20190317"]
source = "NextGen LAN Launcher: start script tried with Proton 11 (2026-10), does not start"

[launch]
# The package's start script starts SmartSteamLoader_x64.exe, which starts
# reactivedrop.exe with SmartSteamEmu. The game stops at the menu
# background: its main thread waits in SmartSteamEmu on recvfrom() of a UDP
# socket that was never bound. Windows fails that call at once (WSAEINVAL)
# and the game goes on; Wine waits for ever (checked with winedbg and a
# winsock trace). Turning off SSE's overlay, leaderboards, online mode or
# going offline does not change it. Without the emulator the menu comes
# up ("no Steam connection"), which is no use on a LAN. Newer releases of
# the game are reported to run under Proton (not tried); that needs a new
# package on the sync server; the notes are shown for the revisions above
# only.
# macOS: CrossOver is Wine as well (not tried).
exe = ""
args = []

[setup.platform_notes.linux]
de = "Startet unter Linux nicht."
en = "Does not start on Linux."

[setup.platform_notes.macos]
de = "Startet unter macOS vermutlich nicht (CrossOver beruht wie Linux auf Wine)."
en = "Probably does not start on macOS (CrossOver is Wine, as on Linux)."
