schema = 1
id = "amongus"
title = "Among Us"
revisions = ["20250308"]
source = "macETI-LAN v0.6.1 (MIT) – verified on Apple M2 Pro with CrossOver 26"

[tested_with]
linux = ["Proton 11.0"]
macos = ["CrossOver 26"]

[launch]
exe = "Among Us.exe"
args = []
required_files = ["Among Us.exe", "UnityPlayer.dll", "GameAssembly.dll"]

[platform.macos]
runner = "crossover"

[setup]
# Starts through Steam emulation, no account needed. LAN games: "Local" in the main menu.

# The game keeps the player's name and the privacy notice it showed in a
# JSON file in the user's LocalLow folder (in the prefix on macOS/Linux,
# made before the first start). Written beforehand, the notice does not
# come and the lobby shows the player's name — checked with Proton 11 and a
# file made from nothing. The game takes up to 10 characters for a name.
[[settings]]
folder = "locallow"
file = "Innersloth/Among Us/player.amogus"
json = "customization.name"
value = "%player%"

[[settings]]
folder = "locallow"
file = "Innersloth/Among Us/player.amogus"
json = "onboarding.privacyPolicyVersion"
type = "number"
value = "4"
