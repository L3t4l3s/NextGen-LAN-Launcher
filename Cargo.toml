[workspace]
resolver = "2"
members = ["crates/lanlauncher-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/L3t4l3s/NextGen-LAN-Launcher"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
# `cookies`: Resilio's web UI hands out a session cookie with its token and
# rejects a token that comes back without it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
