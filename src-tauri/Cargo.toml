[package]
name = "nextgen-lan-launcher"
description = "NextGen LAN Launcher – cross-platform successor to the ETI LAN Launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nextgen_lan_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Tauri CLI turns this on for a production build; with it the webview
# loads the bundled frontend instead of the dev server. Without the feature a
# plain `cargo build --release` produces a binary that looks for
# `http://localhost:1420` and shows a blank window.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
lanlauncher-core = { path = "../crates/lanlauncher-core" }
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.9"
tauri-plugin-clipboard-manager = "2.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
log = "0.4"
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }

# A second start brings the running launcher's window back (it may sit in the
# tray) instead of competing for the sync engine. Linux has its own
# (`lanlauncher_core::instance`): this plugin unwraps a D-Bus session bus
# there and would hand the graphics ladder's successor over to the
# predecessor it replaces.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.4"

# Only for sending this process's standard error to a file: what WebKitGTK
# says about a renderer it cannot use never reaches the Tauri log.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Whether the desktop has a tray to come back from (already built for GTK).
gio = "0.18"
# A web process that died is started again (`reload_a_dead_web_process`);
# the same crate and version wry already builds.
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
